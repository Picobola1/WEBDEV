<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBDEV</title>
    <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    </style>

</head>
<body>
   <div style="
    width: 100%;
    height: 100%;
    position: relative;
    background-image: url('IMG_20260511_192706744.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  ">
   <div>
         <img src="Junk.png" style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            "
            onmouseover="this.style.filter='drop-shadow(0 0 10px black)'"
            onmouseout="this.style.filter='none'"
            >
            <button>
                
            </button>
   </div>
   


  </div>
</body>
</html>
